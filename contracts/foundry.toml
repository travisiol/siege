[profile.default]
src = "src"
test = "test"
out = "forge-out"
libs = ["../node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The brief caps a tick resolution at 25M gas; give the harness room to measure it.
gas_limit = 30000000
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 64, fail_on_revert = false }

[fmt]
line_length = 100
